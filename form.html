<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--Action attribute is used to define what action needs to be performed when a form is submitted or where the form data should be sent-->
    <!--input-> used to create multiple from controls
    there are mutiple types of input can be created using type attribute-->
     <form action="/second.html"></form>
     <div> 
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your username" name="username" />

     </div>
     <div>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password"/>
     </div>
     <div>
        <label for="age">enter age</label>
        <input type="number" id="age" placeholder="Enter your age"/>

     </div>
     <input type="checkbox" id="checkbox" name="checkbox" >
     <label for="checkbox">I agree to the terms and conditions</label>
     <br>
     <input type="radio" id="male" name="gender" value="male">
     <label for="male">Male</label>
     <input type="radio" id="female" name="gender" value="female">
     <label for="female">Female</label>

<div>
    choose your subject:
    <input type="checkbox" id="math" name="sub" value="math"/>
    <label for="math">math</label>
    <input type="checkbox" id="science" name="sub" value="sci"/>
    <label for="science">science</label>
     <input type="checkbox" id="english" name="sub" value="eng"/>
    <label for="english">english</label>
</div>
     <div>
        <!--dropdown -->
       choose your profession:
        <select name="profession" id="profession">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="engineer">Engineer</option>
            <option value="doctor">Doctor</option>
        </select> 

     </div>
     <!--range-->
     <div>
        <label for="vol"> select your volume level</label>
        <input type="range" id="vol" min="0" max="100" name="vol"/>
     </div>
     <!--textarea-->
     <label for="feedback">please give your valueable feedback</label>
     <textarea id="feedback" name="feedback"></textarea>

     <button type="submit">Submit</button>
     <button type="reset">Reset</button>
     <button type="button">Click me</button>
     <!--agar hum input mai sabka nam same rakhenge toh or radio type ho toh hum bus ak hi radio button click kar skte hai-->
