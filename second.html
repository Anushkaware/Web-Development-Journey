<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Attribute are used to add more information to HTML elements 
    example: <p title="This is a paragraph">Hello, World!</p> -->
    <!--Anchor tag used to add link to your page it is used to link two type of link absolute(internet) and relative(file)-->
    <a href="https://www.google.com">google link</a>
    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo"> <!--The <img> tag is used to embed an image in an HTML page. It is a self-closing tag and does not require a closing tag. The src attribute specifies the path to the image file, and the alt attribute provides alternative text for the image. -->
    <img src="butterfly.jpeg" alt="butterfly image"
    height="200" width="300"> <!--absolute image is that when we download an image and relative image is when we direct use internet link -->
    <!--ctrl+/ is the shortcut for adding a comment -->
</body>
</html>
